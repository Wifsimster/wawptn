name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for leaked secrets in frontend
        run: |
          if grep -rn 'STRIPE_SECRET_KEY\|STRIPE_WEBHOOK_SECRET\|_API_SECRET\|APP_SECRET' packages/frontend/src/; then
            echo "::error::Backend secrets referenced in frontend code!"
            exit 1
          fi

      - name: Build shared types
        run: npm run build:types

      - name: Run linter
        run: npm run lint

      - name: Type check backend
        run: npx tsc --noEmit -p packages/backend/tsconfig.json

      - name: Type check frontend
        run: npx tsc --noEmit -p packages/frontend/tsconfig.app.json

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build:types

      - name: Run tests
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run in the official Playwright image: browsers + OS deps are preinstalled,
    # so there is no `playwright install` step (which hung indefinitely on the
    # runner after downloading the browser). The tag must match the pinned
    # @playwright/test version so the bundled browser build matches.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build:types

      - name: Run E2E tests
        # Scoped to Mobile Chrome — the WebKit/Mobile Safari project stays in
        # playwright.config.ts for local runs but is not gated in CI yet.
        run: npm run test:e2e -- --project="Mobile Chrome"
        working-directory: packages/frontend

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 7
